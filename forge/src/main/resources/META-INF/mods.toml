    mandatory=true
    versionRange="[1.20.1]"
    ordering="NONE"
    side="BOTH"
[[dependencies."${mod_id}"]]
    modId="jei"
    mandatory=false
    versionRange="[${min_jei_version},)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies."${mod_id}"]]
    modId="emi"
    mandatory=false
    versionRange="[${min_emi_forge_version},)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies."${mod_id}"]]
    modId="crafttweaker"
    mandatory=false
    versionRange="[${min_crafttweaker_version},)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies."${mod_id}"]]
    modId="mekanism"
    mandatory=false
    versionRange="[${min_mekanism_version},)"
    ordering="AFTER"
    side="CLIENT"
