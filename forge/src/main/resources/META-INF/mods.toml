
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="CraftTweaker GUI"
logoFile="assets/ctgui/logo.png"
authors="Bommels05"
displayTest="IGNORE_ALL_VERSION"
description='''Recipe editing GUI for CraftTweaker'''

[[dependencies."${mod_id}"]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies."${mod_id}"]]
